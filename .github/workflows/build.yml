name: Build check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish RAMChrome
        run: dotnet publish desktop/RAMChrome/RAMChrome.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/RAMChrome

      - name: Publish RAMChrome updater
        run: dotnet publish desktop/RAMChrome.Updater/RAMChrome.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/RAMChrome

      - name: Publish RAMDiscord
        run: dotnet publish desktop/RAMDiscord/RAMDiscord.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/RAMDiscord

      - name: Publish RAMDiscord updater
        run: dotnet publish desktop/RAMDiscord.Updater/RAMDiscord.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/RAMDiscord

      - name: Upload RAMChrome build
        uses: actions/upload-artifact@v4
        with:
          name: RAMChrome-win-x64
          path: artifacts/RAMChrome/
          if-no-files-found: error
          retention-days: 30

      - name: Upload RAMDiscord build
        uses: actions/upload-artifact@v4
        with:
          name: RAMDiscord-win-x64-v1.0.0
          path: artifacts/RAMDiscord/
          if-no-files-found: error
          retention-days: 30