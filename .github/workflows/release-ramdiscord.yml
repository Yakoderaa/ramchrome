name: Release RAMDiscord

on:
  push:
    tags:
      - "discord-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish RAMDiscord
        shell: pwsh
        run: |
          dotnet publish desktop/RAMDiscord/RAMDiscord.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          dotnet publish desktop/RAMDiscord.Updater/RAMDiscord.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath RAMDiscord.zip
          $hash = (Get-FileHash RAMDiscord.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path RAMDiscord.zip.sha256 -Value "$hash  RAMDiscord.zip" -NoNewline
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RAMDiscord.zip
            RAMDiscord.zip.sha256
          generate_release_notes: true