name: Build RAMChrome

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish desktop
        shell: pwsh
        run: |
          dotnet publish desktop/RAMChrome/RAMChrome.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          dotnet publish desktop/RAMChrome.Updater/RAMChrome.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath RAMChrome.zip
          $hash = (Get-FileHash RAMChrome.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path RAMChrome.zip.sha256 -Value "$hash  RAMChrome.zip" -NoNewline
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RAMChrome.zip
            RAMChrome.zip.sha256
          generate_release_notes: true
